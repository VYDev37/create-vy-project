name: Publish Package to npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: Debug auth
        run: npm whoami

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter create-vy-project build

      - name: Publish to npm
        run: pnpm --filter create-vy-project publish --access public --no-git-checks
